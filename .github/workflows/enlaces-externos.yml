name: Enlaces externos

# Comprueba cada semana que los enlaces externos de todos los .md siguen respondiendo.
# Los enlaces se rompen con el tiempo; no depende de ningún PR. Si falla, el fallo se ve en la pestaña Actions.
# Solo lectura, sin secretos. Se puede lanzar a mano desde Actions (workflow_dispatch).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enlaces:
    name: enlaces-externos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1, verificado el 2026-11-18: el tag apunta al commit completo indicado.
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar los enlaces externos
        run: python3 -B .github/scripts/comprobar_calidad.py enlaces
